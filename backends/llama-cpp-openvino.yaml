# LocalAI Backend Gallery entry
# Add this gallery URL to your LocalAI installation (alongside the default LocalAI gallery):
#
# Usage:
#   export LOCALAI_BACKEND_GALLERIES='[{"name":"localai","url":"github:mudler/LocalAI/backend/index.yaml@master"},{"name":"secondof9","url":"https://raw.githubusercontent.com/secondof9/llama-cpp-openvino-backend/main/backends/llama-cpp-openvino.yaml"}]'
#
# Or install directly without configuring a gallery:
#   curl -X POST http://localhost:8080/api/backends/install-external \
#     -H "Content-Type: application/json" \
#     -d '{"uri":"ghcr.io/secondof9/llama-cpp-openvino-backend:main","name":"llama-cpp-openvino","alias":"llama-cpp"}'
#
# The image is ghcr.io/secondof9/llama-cpp-openvino-backend:main (public — no credentials required).
- name: "llama-cpp-openvino"
  alias: "llama-cpp"
  license: mit
  description: |
    llama.cpp gRPC backend for LocalAI with Intel OpenVINO acceleration (CPU/iGPU/dGPU/NPU)
  urls:
    - https://github.com/secondof9/llama-cpp-openvino-backend
  tags:
    - "llm"
    - "text-generation"
    - "openvino"
  uri: "ghcr.io/secondof9/llama-cpp-openvino-backend:main"
